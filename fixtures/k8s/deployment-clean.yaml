# Policy-compliant counterpart to fixtures/k8s/deployment-vulnerable.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      hostNetwork: false
      containers:
        - name: webapp
          image: demo/webapp:2.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - containerPort: 8080
