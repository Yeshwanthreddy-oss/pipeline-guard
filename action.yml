name: "pipeline-guard"
description: >-
  Container image + IaC security gate: Trivy image scan + OPA/Conftest-style
  policy checks on Terraform/Kubernetes, aggregated into a risk score that
  blocks the PR above a threshold and can open a follow-up auto-fix PR.
author: "pipeline-guard"
branding:
  icon: "shield"
  color: "red"

inputs:
  dockerfile:
    description: "Path to the Dockerfile to check for outdated base images"
    required: false
  trivy-report:
    description: "Path to a pre-generated `trivy image --format json` report"
    required: false
  terraform-plan:
    description: "Path to a `terraform show -json` plan file"
    required: false
  terraform-dir:
    description: "Terraform source directory (enables the encryption-flag auto-fix)"
    required: false
  k8s-manifests:
    description: "Space-separated list of Kubernetes manifest files"
    required: false
  threshold:
    description: "Maximum acceptable risk score before the build is blocked"
    required: false
    default: "30"
  auto-fix:
    description: "If true, open a follow-up PR with mechanical fixes for fixable findings"
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment / open the auto-fix PR"
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: "The aggregated risk score"
    value: ${{ steps.gate.outputs.score }}
  passed:
    description: "'true' if the score was at or below the threshold"
    value: ${{ steps.gate.outputs.passed }}
  report-path:
    description: "Path to the rendered Markdown PR comment"
    value: ${{ steps.gate.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pipeline-guard
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run scan + gate
      id: gate
      shell: bash
      run: |
        set -e
        args=(scan --threshold "${{ inputs.threshold }}" --report-out pipeline-guard-report.md --json-out pipeline-guard-scan.json --no-fail)
        [ -n "${{ inputs.dockerfile }}" ] && args+=(--dockerfile "${{ inputs.dockerfile }}")
        [ -n "${{ inputs.trivy-report }}" ] && args+=(--trivy-report "${{ inputs.trivy-report }}")
        [ -n "${{ inputs.terraform-plan }}" ] && args+=(--terraform-plan "${{ inputs.terraform-plan }}")
        if [ -n "${{ inputs.k8s-manifests }}" ]; then
          args+=(--k8s ${{ inputs.k8s-manifests }})
        fi
        pipeline-guard "${args[@]}"

        score=$(python -c "import json;print(json.load(open('pipeline-guard-scan.json'))['score'])")
        passed=$(python -c "import json;print(str(json.load(open('pipeline-guard-scan.json'))['passed']).lower())")
        echo "score=$score" >> "$GITHUB_OUTPUT"
        echo "passed=$passed" >> "$GITHUB_OUTPUT"
        echo "report_path=pipeline-guard-report.md" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ github.event.pull_request }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('pipeline-guard-report.md', 'utf8');
          const marker = '<!-- pipeline-guard:report -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Open auto-fix PR
      if: ${{ inputs.auto-fix == 'true' }}
      shell: bash
      run: |
        pipeline-guard autofix \
          --scan-json pipeline-guard-scan.json \
          ${{ inputs.terraform-dir && format('--terraform-dir {0}', inputs.terraform-dir) || '' }} \
          --repo-dir "${{ github.workspace }}" \
          --apply

    - name: Fail build if blocked
      shell: bash
      run: |
        if [ "${{ steps.gate.outputs.passed }}" != "true" ]; then
          echo "::error::pipeline-guard blocked this build (score ${{ steps.gate.outputs.score }} > threshold ${{ inputs.threshold }})"
          exit 1
        fi
