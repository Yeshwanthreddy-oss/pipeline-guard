[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-guard"
version = "0.1.0"
description = "A reusable CI gate: Trivy image scans + OPA/Conftest-style IaC policy checks, aggregated into a risk score that blocks merges and opens auto-fix PRs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
github = [
    "requests>=2.31",
]

[project.scripts]
pipeline-guard = "pipeline_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
